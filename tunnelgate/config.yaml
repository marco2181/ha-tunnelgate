name: TunnelGate
version: "1.0.2"
timeout: 30
slug: tunnelgate
description: Route only selected LAN devices (e.g. a TV) through a WireGuard (NordLynx) tunnel of your NordVPN subscription. Unofficial, not affiliated with Nord Security.
url: https://github.com/marco2181/ha-tunnelgate
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
full_access: true
apparmor: false
privileged:
  - NET_ADMIN
  - SYS_MODULE
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock
panel_title: TunnelGate
options:
  token: ""
  clients: []
  lan_interface: eth0
  default_country: US
  default_city: ""
  kill_switch_on_stop: false
  language: en
schema:
  token: password
  clients:
    - str
  lan_interface: str
  default_country: str
  default_city: str?
  kill_switch_on_stop: bool
  language: list(en|it)
