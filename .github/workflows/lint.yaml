name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon:
    name: Add-on configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2.9
        with:
          path: "./tunnelgate"

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tunnelgate/app/main.py
