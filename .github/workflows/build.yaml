name: Build add-on images

# Builds the add-on for every architecture and publishes it to GitHub Container
# Registry, so Home Assistant only has to download a ready image.
on:
  push:
    branches: [main]
    paths: ["tunnelgate/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on metadata
        id: info
        run: |
          echo "version=$(yq '.version' tunnelgate/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "from=$(yq '.build_from.${{ matrix.arch }}' tunnelgate/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tunnelgate
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.info.outputs.from }}
          labels: |
            io.hass.name=TunnelGate
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: |
            ghcr.io/${{ steps.info.outputs.owner }}/${{ matrix.arch }}-addon-tunnelgate:${{ steps.info.outputs.version }}
            ghcr.io/${{ steps.info.outputs.owner }}/${{ matrix.arch }}-addon-tunnelgate:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
